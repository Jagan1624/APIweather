<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Contact | Jagan Portfolio</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <header>

        <h1>Contact Me</h1>

        <nav aria-label="Main Navigation">

            <ul>

                <li><a href="index.html">Home</a></li>

                <li><a href="about.html">About</a></li>

                <li><a href="projects.html">Projects</a></li>

                <li><a href="todo.html">To-Do App</a></li>

                <li><a href="contact.html">Contact</a></li>

            </ul>

        </nav>

    </header>

    <main>

        <section class="hero">

            <h2>Get In Touch</h2>

            <p>
                Feel free to contact me anytime.
            </p>

        </section>

        <section>

            <h2>Contact Details</h2>

            <p>
                <strong>Email:</strong>
                jagan@example.com
            </p>

            <p>
                <strong>Phone:</strong>
                +91 9876543210
            </p>

            <p>
                <strong>Location:</strong>
                Andhra Pradesh, India
            </p>

        </section>

        <section>

            <h2>Send Message</h2>

            <form>

                <div>

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        required
                    >

                </div>

                <div>

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        required
                    >

                </div>

                <div>

                    <label for="message">
                        Message
                    </label>

                    <textarea
                        id="message"
                        rows="5"
                        required>
                    </textarea>

                </div>

                <button type="submit">

                    Send Message

                </button>

            </form>

        </section>

    </main>

    <footer>

        <p>
            © 2026 Jagan Portfolio
        </p>

    </footer>

</body>

</html>
